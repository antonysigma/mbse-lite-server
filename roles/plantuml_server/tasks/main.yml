- name: Create PlantUML service user
  ansible.builtin.user:
    name: "{{ plantuml_server_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ plantuml_server_home }}"
    create_home: false
    state: present
  become: true

- name: Create PlantUML server directory
  ansible.builtin.file:
    path: "{{ plantuml_server_home }}"
    state: directory
    owner: "{{ plantuml_server_user }}"
    group: "{{ plantuml_server_user }}"
    mode: "0755"
  become: true

- name: Download PlantUML GPL jar
  ansible.builtin.get_url:
    url: "{{ plantuml_server_jar_url }}"
    dest: "{{ plantuml_server_jar_path }}"
    owner: "{{ plantuml_server_user }}"
    group: "{{ plantuml_server_user }}"
    mode: "0644"
  become: true
  become_user: "{{ plantuml_server_user }}"
  notify: Restart PlantUML server

- name: Install PlantUML systemd service
  ansible.builtin.template:
    src: plantuml-server.service.j2
    dest: "/etc/systemd/system/{{ plantuml_server_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd configs
    - Restart PlantUML server

- name: Enable and start PlantUML server
  ansible.builtin.systemd:
    name: "{{ plantuml_server_service_name }}.service"
    enabled: true
    state: started
  become: true
